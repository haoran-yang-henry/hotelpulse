[project]
name = "hotelpulse"
version = "0.1.0"
description = "Hotel operations data platform: PMS, web tracking, inventory and reviews -> PostgreSQL warehouse -> Metabase, orchestrated by Airflow."
readme = "README.md"
requires-python = ">=3.12"
# Versions aligned with the packages shipped in apache/airflow:3.3.2-python3.12,
# so the same code runs locally and inside Airflow tasks.
dependencies = [
    "psycopg[binary]>=3.3,<3.4",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pydantic>=2.13,<3",
    "fastapi>=0.136,<0.137",
    "uvicorn>=0.52",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "sqlfluff>=3.4",
    "pre-commit>=4.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["planning"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII in strings/comments

[tool.ruff.lint.isort]
known-first-party = ["hotelpulse"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra -q"
filterwarnings = [
    # starlette's TestClient prefers httpx2; httpx is what the Airflow image ships
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
