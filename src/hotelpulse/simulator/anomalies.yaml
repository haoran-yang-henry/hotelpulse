# Known anomalies injected into the simulated sources. They are the ground truth used to
# judge whether dashboards and generated chart explanations surface real problems.
# Offsets are in days relative to the simulation anchor date (the dataset's "today").
anomalies:
  - id: A1
    name: mobile_payment_outage
    description: >-
      The website's mobile payment step fails intermittently. Part of the guests who
      would have booked direct give up and book the same stay through Booking.com.
    start_offset_days: -24
    end_offset_days: -10
    effects:
      pms:
        website_to_ota_share: 0.55
      web:
        # the leaked guests' sessions end in failed mobile payments with this error
        error_code: gateway_timeout
        retry_share: 0.4

  - id: A5
    name: consent_banner_redesign
    description: >-
      A redesigned cookie banner makes "Reject" the more prominent button. Fewer visitors
      accept analytics cookies, so a smaller share of website traffic and bookings is tracked.
    start_offset_days: -60
    end_offset_days: 3650  # still live
    effects:
      web:
        consent_rate: 0.55

  - id: A2
    name: laundry_supplier_change
    description: >-
      The resort switched to a new laundry supplier that bills per towel and collects towels
      more often. Towels laundered per occupied room night rise by about 35 %.
    start_offset_days: -35
    end_offset_days: 3650  # still live
    effects:
      inventory:
        hotel: RESORT
        item: towel_laundry
        factor: 1.35

  - id: A3
    name: breakfast_capacity
    description: >-
      Breakfast is staffed for a normal house. When the hotel is (nearly) full during a stay,
      queues and empty buffets make breakfast complaints in reviews roughly twice as likely.
    start_offset_days: -3650  # structural: always present
    end_offset_days: 3650
    effects:
      reviews:
        occupancy_above: 0.90
        breakfast_complaint_factor: 2.2
